<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1570" viewBox="0 0 1440 1570" role="img" aria-labelledby="title desc">
  <title id="title">Git 中文日常速查表</title>
  <desc id="desc">Git 2.51+ 日常命令速查，按查看、提交、分支、协作、暂存工作、撤销恢复排列。覆盖工作区或改写历史的命令附有明确文字提示，完整说明见 README。</desc>
  <defs>
    <style>
      text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", sans-serif; fill: #172e43; }
      .code { font-family: "DejaVu Sans Mono", Consolas, monospace; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563a6"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f75"/></marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a64b19"/></marker>
  </defs>
  <rect width="1440" height="1570" rx="20" fill="#f4f7fa"/>
  <text x="40" y="62" font-size="36" style="fill:#172e43" font-weight="700">Git 日常速查</text>
  <text x="1400" y="60" font-size="21" style="fill:#087f75" font-weight="700" text-anchor="end">Git 2.51+</text>
  <text x="40" y="104" font-size="22" style="fill:#526779">完整命令 · 按任务查找 · 先看状态，再执行修改</text>
  <text x="40" y="139" font-size="19" style="fill:#526779">&lt;file&gt;、&lt;commit&gt; 需替换；main、feature 是示例分支。不同命令按需选择，不要整表连续执行。</text>
  <rect x="40" y="176" width="660" height="392" rx="14" fill="white" stroke="#d7e0e8"/>
  <text x="64" y="216" font-size="25" style="fill:#087f75" font-weight="700">01  查看与比较</text>
  <text x="64" y="261" font-size="20" style="fill:#172e43" class="code">git status -sb</text>
  <text x="64" y="288" font-size="18" style="fill:#526779">查看分支和文件状态</text>
  <text x="64" y="322" font-size="20" style="fill:#172e43" class="code">git diff</text>
  <text x="64" y="349" font-size="18" style="fill:#526779">工作区与暂存区的差异</text>
  <text x="64" y="383" font-size="20" style="fill:#172e43" class="code">git diff --cached</text>
  <text x="64" y="410" font-size="18" style="fill:#526779">暂存区与 HEAD 的差异</text>
  <text x="64" y="444" font-size="20" style="fill:#172e43" class="code">git log --oneline --graph --all</text>
  <text x="64" y="471" font-size="18" style="fill:#526779">查看所有分支的提交图</text>
  <text x="64" y="505" font-size="20" style="fill:#172e43" class="code">git diff main...feature</text>
  <text x="64" y="532" font-size="18" style="fill:#526779">共同祖先到 feature 的变化</text>
  <rect x="740" y="176" width="660" height="392" rx="14" fill="white" stroke="#d7e0e8"/>
  <text x="764" y="216" font-size="25" style="fill:#087f75" font-weight="700">02  选择与提交</text>
  <text x="764" y="261" font-size="20" style="fill:#172e43" class="code">git add -- &lt;file&gt;</text>
  <text x="764" y="288" font-size="18" style="fill:#526779">暂存指定文件</text>
  <text x="764" y="322" font-size="20" style="fill:#172e43" class="code">git add -p</text>
  <text x="764" y="349" font-size="18" style="fill:#526779">逐块选择修改</text>
  <text x="764" y="383" font-size="20" style="fill:#172e43" class="code">git add -A</text>
  <text x="764" y="410" font-size="18" style="fill:#526779">暂存整个仓库的变化</text>
  <text x="764" y="444" font-size="20" style="fill:#172e43" class="code">git commit -m &quot;message&quot;</text>
  <text x="764" y="471" font-size="18" style="fill:#526779">把暂存区保存为本地提交</text>
  <text x="764" y="505" font-size="20" style="fill:#172e43" class="code">git commit --amend --no-edit</text>
  <text x="764" y="532" font-size="18" style="fill:#a64b19">改写历史：替换最后一次提交</text>
  <rect x="40" y="592" width="660" height="392" rx="14" fill="white" stroke="#d7e0e8"/>
  <text x="64" y="632" font-size="25" style="fill:#087f75" font-weight="700">03  分支开发</text>
  <text x="64" y="677" font-size="20" style="fill:#172e43" class="code">git switch -c feature</text>
  <text x="64" y="704" font-size="18" style="fill:#526779">创建并切换分支</text>
  <text x="64" y="738" font-size="20" style="fill:#172e43" class="code">git switch main</text>
  <text x="64" y="765" font-size="18" style="fill:#526779">切换已有分支</text>
  <text x="64" y="799" font-size="20" style="fill:#172e43" class="code">git branch -vv</text>
  <text x="64" y="826" font-size="18" style="fill:#526779">查看分支与上游关系</text>
  <text x="64" y="860" font-size="20" style="fill:#172e43" class="code">git merge feature</text>
  <text x="64" y="887" font-size="18" style="fill:#526779">合并 feature 到当前分支</text>
  <text x="64" y="921" font-size="20" style="fill:#172e43" class="code">git rebase main</text>
  <text x="64" y="948" font-size="18" style="fill:#a64b19">改写历史：在 main 后重放当前分支</text>
  <rect x="740" y="592" width="660" height="392" rx="14" fill="white" stroke="#d7e0e8"/>
  <text x="764" y="632" font-size="25" style="fill:#087f75" font-weight="700">04  远程协作</text>
  <text x="764" y="677" font-size="20" style="fill:#172e43" class="code">git remote -v</text>
  <text x="764" y="704" font-size="18" style="fill:#526779">查看远程关联</text>
  <text x="764" y="738" font-size="20" style="fill:#172e43" class="code">git fetch --prune origin</text>
  <text x="764" y="765" font-size="18" style="fill:#526779">更新远程记录，清理失效跟踪引用</text>
  <text x="764" y="799" font-size="20" style="fill:#172e43" class="code">git pull --ff-only</text>
  <text x="764" y="826" font-size="18" style="fill:#526779">获取更新，仅允许快进整合</text>
  <text x="764" y="860" font-size="20" style="fill:#172e43" class="code">git push -u origin feature</text>
  <text x="764" y="887" font-size="18" style="fill:#526779">发布分支并建立上游</text>
  <text x="764" y="921" font-size="20" style="fill:#172e43" class="code">git push</text>
  <text x="764" y="948" font-size="18" style="fill:#526779">推送当前分支（需已配置上游）</text>
  <rect x="40" y="1008" width="660" height="392" rx="14" fill="white" stroke="#d7e0e8"/>
  <text x="64" y="1048" font-size="25" style="fill:#087f75" font-weight="700">05  临时保存工作</text>
  <text x="64" y="1093" font-size="20" style="fill:#172e43" class="code">git stash push -u -m &quot;WIP&quot;</text>
  <text x="64" y="1120" font-size="18" style="fill:#526779">保存修改与未跟踪文件，不含忽略文件</text>
  <text x="64" y="1154" font-size="20" style="fill:#172e43" class="code">git stash list</text>
  <text x="64" y="1181" font-size="18" style="fill:#526779">列出临时保存的记录</text>
  <text x="64" y="1215" font-size="20" style="fill:#172e43" class="code">git stash show -p &#x27;stash@{0}&#x27;</text>
  <text x="64" y="1242" font-size="18" style="fill:#526779">查看已跟踪文件补丁；未跟踪需加 -u</text>
  <text x="64" y="1276" font-size="20" style="fill:#172e43" class="code">git stash apply &#x27;stash@{0}&#x27;</text>
  <text x="64" y="1303" font-size="18" style="fill:#526779">恢复工作内容，保留 stash 记录</text>
  <text x="64" y="1337" font-size="20" style="fill:#172e43" class="code">git stash drop &#x27;stash@{0}&#x27;</text>
  <text x="64" y="1364" font-size="18" style="fill:#a64b19">删除记录：仅在确认恢复后执行</text>
  <rect x="740" y="1008" width="660" height="392" rx="14" fill="white" stroke="#d7e0e8"/>
  <text x="764" y="1048" font-size="25" style="fill:#087f75" font-weight="700">06  撤销与恢复</text>
  <text x="764" y="1093" font-size="20" style="fill:#172e43" class="code">git restore --staged -- &lt;file&gt;</text>
  <text x="764" y="1120" font-size="18" style="fill:#526779">取消暂存，保留工作区</text>
  <text x="764" y="1154" font-size="20" style="fill:#172e43" class="code">git restore -- &lt;file&gt;</text>
  <text x="764" y="1181" font-size="18" style="fill:#a64b19">丢弃修改：用暂存区覆盖工作区</text>
  <text x="764" y="1215" font-size="20" style="fill:#172e43" class="code">git revert &lt;commit&gt;</text>
  <text x="764" y="1242" font-size="18" style="fill:#526779">新增反向提交，保留原有历史</text>
  <text x="764" y="1276" font-size="20" style="fill:#172e43" class="code">git reset --soft &lt;commit&gt;</text>
  <text x="764" y="1303" font-size="18" style="fill:#a64b19">改写历史：暂存区与工作区保持不变</text>
  <text x="764" y="1337" font-size="20" style="fill:#172e43" class="code">git reflog</text>
  <text x="764" y="1364" font-size="18" style="fill:#526779">查找本机历史记录，再建救援分支</text>
  <text x="40" y="1462" font-size="23" style="fill:#a64b19" font-weight="700">覆盖与改写的后果要分清</text>
  <text x="40" y="1500" font-size="21" style="fill:#a64b19">restore / clean 可能丢失未保存内容；rebase / amend / reset 会改变分支历史。</text>
  <text x="40" y="1539" font-size="19" style="fill:#526779">详细说明、冲突处理、旧命令对照与参考资料见 README.md；图表源文件为 img/*.svg。</text>
</svg>
