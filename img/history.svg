<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1010" viewBox="0 0 1200 1010" role="img" aria-labelledby="title desc">
  <title id="title">分支历史：merge、rebase 与 squash</title>
  <desc id="desc">三种结果从同一分叉开始：A 为共同祖先，main 有 B，feature 有 C、D。merge 的 M 有 B、D 两个父提交；rebase 将 C、D 重放为 B 后的 C′、D′；squash 在 main 创建单亲 S，原 feature 分支不变。各面板为独立操作结果，连线从父提交指向子提交。</desc>
  <defs>
    <style>
      text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", sans-serif; fill: #172e43; }
      .code { font-family: "DejaVu Sans Mono", Consolas, monospace; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563a6"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f75"/></marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a64b19"/></marker>
  </defs>
  <rect width="1200" height="1010" rx="20" fill="#f4f7fa"/>
  <text x="40" y="58" font-size="32" style="fill:#172e43" font-weight="700">同一段分叉，三种处理结果</text>
  <text x="40" y="97" font-size="20" style="fill:#526779">每个结果独立从初始状态开始；连线从父提交指向子提交。</text>
  <rect x="40" y="125" width="1120" height="155" rx="14" fill="white" stroke="#d7e0e8"/>
  <text x="62" y="161" font-size="23" style="fill:#172e43" font-weight="700">初始状态</text>
  <path d="M 350 185 L 478 185" fill="none" stroke="#2563a6" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M 350 185 L 478 245" fill="none" stroke="#087f75" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <path d="M 520 245 L 648 245" fill="none" stroke="#087f75" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <circle cx="330" cy="185" r="19" fill="white" stroke="#2563a6" stroke-width="3"/>
  <text x="330" y="191" font-size="18" style="fill:#2563a6" font-weight="700" text-anchor="middle">A</text>
  <circle cx="500" cy="185" r="19" fill="white" stroke="#2563a6" stroke-width="3"/>
  <text x="500" y="191" font-size="18" style="fill:#2563a6" font-weight="700" text-anchor="middle">B</text>
  <circle cx="500" cy="245" r="19" fill="white" stroke="#087f75" stroke-width="3"/>
  <text x="500" y="251" font-size="18" style="fill:#087f75" font-weight="700" text-anchor="middle">C</text>
  <circle cx="670" cy="245" r="19" fill="white" stroke="#087f75" stroke-width="3"/>
  <text x="670" y="251" font-size="18" style="fill:#087f75" font-weight="700" text-anchor="middle">D</text>
  <text x="545" y="191" font-size="19" style="fill:#2563a6" class="code">main</text>
  <text x="712" y="251" font-size="19" style="fill:#087f75" class="code">feature</text>
  <rect x="40" y="300" width="1120" height="200" rx="14" fill="white" stroke="#d7e0e8"/>
  <text x="62" y="337" font-size="18" style="fill:#2563a6" font-weight="700">MERGE</text>
  <text x="62" y="374" font-size="23" style="fill:#172e43" font-weight="700">保留两条历史</text>
  <text x="62" y="412" font-size="18" style="fill:#526779">M 有两个父提交</text>
  <path d="M 440 365 L 558 365" fill="none" stroke="#2563a6" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M 440 365 L 558 448" fill="none" stroke="#087f75" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <path d="M 600 448 L 718 448" fill="none" stroke="#087f75" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <path d="M 600 365 L 878 365" fill="none" stroke="#2563a6" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M 760 448 L 878 365" fill="none" stroke="#087f75" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <circle cx="420" cy="365" r="19" fill="white" stroke="#2563a6" stroke-width="3"/>
  <text x="420" y="371" font-size="18" style="fill:#2563a6" font-weight="700" text-anchor="middle">A</text>
  <circle cx="580" cy="365" r="19" fill="white" stroke="#2563a6" stroke-width="3"/>
  <text x="580" y="371" font-size="18" style="fill:#2563a6" font-weight="700" text-anchor="middle">B</text>
  <circle cx="580" cy="448" r="19" fill="white" stroke="#087f75" stroke-width="3"/>
  <text x="580" y="454" font-size="18" style="fill:#087f75" font-weight="700" text-anchor="middle">C</text>
  <circle cx="740" cy="448" r="19" fill="white" stroke="#087f75" stroke-width="3"/>
  <text x="740" y="454" font-size="18" style="fill:#087f75" font-weight="700" text-anchor="middle">D</text>
  <circle cx="900" cy="365" r="19" fill="white" stroke="#2563a6" stroke-width="3"/>
  <text x="900" y="371" font-size="18" style="fill:#2563a6" font-weight="700" text-anchor="middle">M</text>
  <text x="942" y="371" font-size="19" style="fill:#2563a6" class="code">main</text>
  <text x="790" y="476" font-size="18" style="fill:#087f75" class="code">feature → D</text>
  <rect x="40" y="520" width="1120" height="200" rx="14" fill="white" stroke="#d7e0e8"/>
  <text x="62" y="557" font-size="18" style="fill:#087f75" font-weight="700">REBASE</text>
  <text x="62" y="594" font-size="23" style="fill:#172e43" font-weight="700">重新生成提交</text>
  <text x="62" y="632" font-size="18" style="fill:#526779">C′、D′ 是新 ID</text>
  <path d="M 440 625 L 558 625" fill="none" stroke="#2563a6" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M 600 625 L 718 625" fill="none" stroke="#087f75" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <path d="M 760 625 L 878 625" fill="none" stroke="#087f75" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <circle cx="420" cy="625" r="19" fill="white" stroke="#2563a6" stroke-width="3"/>
  <text x="420" y="631" font-size="18" style="fill:#2563a6" font-weight="700" text-anchor="middle">A</text>
  <circle cx="580" cy="625" r="19" fill="white" stroke="#2563a6" stroke-width="3"/>
  <text x="580" y="631" font-size="18" style="fill:#2563a6" font-weight="700" text-anchor="middle">B</text>
  <circle cx="740" cy="625" r="19" fill="white" stroke="#087f75" stroke-width="3"/>
  <text x="740" y="631" font-size="18" style="fill:#087f75" font-weight="700" text-anchor="middle">C′</text>
  <circle cx="900" cy="625" r="19" fill="white" stroke="#087f75" stroke-width="3"/>
  <text x="900" y="631" font-size="18" style="fill:#087f75" font-weight="700" text-anchor="middle">D′</text>
  <text x="550" y="578" font-size="19" style="fill:#2563a6" class="code">main</text>
  <text x="938" y="631" font-size="19" style="fill:#087f75" class="code">feature</text>
  <text x="420" y="691" font-size="18" style="fill:#526779">在 feature 执行 rebase main；main 仍指向 B。</text>
  <rect x="40" y="740" width="1120" height="200" rx="14" fill="white" stroke="#d7e0e8"/>
  <text x="62" y="777" font-size="18" style="fill:#a64b19" font-weight="700">SQUASH + COMMIT</text>
  <text x="62" y="814" font-size="23" style="fill:#172e43" font-weight="700">提交最终结果</text>
  <text x="62" y="852" font-size="18" style="fill:#526779">S 只有 B 一个父提交</text>
  <path d="M 440 805 L 558 805" fill="none" stroke="#2563a6" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M 600 805 L 878 805" fill="none" stroke="#a64b19" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <path d="M 440 805 L 558 888" fill="none" stroke="#087f75" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <path d="M 600 888 L 718 888" fill="none" stroke="#087f75" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <circle cx="420" cy="805" r="19" fill="white" stroke="#2563a6" stroke-width="3"/>
  <text x="420" y="811" font-size="18" style="fill:#2563a6" font-weight="700" text-anchor="middle">A</text>
  <circle cx="580" cy="805" r="19" fill="white" stroke="#2563a6" stroke-width="3"/>
  <text x="580" y="811" font-size="18" style="fill:#2563a6" font-weight="700" text-anchor="middle">B</text>
  <circle cx="900" cy="805" r="19" fill="white" stroke="#a64b19" stroke-width="3"/>
  <text x="900" y="811" font-size="18" style="fill:#a64b19" font-weight="700" text-anchor="middle">S</text>
  <circle cx="580" cy="888" r="19" fill="white" stroke="#087f75" stroke-width="3"/>
  <text x="580" y="894" font-size="18" style="fill:#087f75" font-weight="700" text-anchor="middle">C</text>
  <circle cx="740" cy="888" r="19" fill="white" stroke="#087f75" stroke-width="3"/>
  <text x="740" y="894" font-size="18" style="fill:#087f75" font-weight="700" text-anchor="middle">D</text>
  <text x="944" y="811" font-size="19" style="fill:#a64b19" class="code">main</text>
  <text x="790" y="894" font-size="18" style="fill:#087f75" class="code">feature → D</text>
  <text x="40" y="981" font-size="20" style="fill:#526779">快进合并无需创建 M；squash 准备暂存结果后，仍需手动 commit。</text>
</svg>
